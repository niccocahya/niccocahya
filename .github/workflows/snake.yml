name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # setiap hari jam 07:00 WIB
  workflow_dispatch:       # bisa dijalankan manual dari tab Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0a0a0a&color_dots=#ebedf0,#c4c4c4,#8a8a8a,#4a4a4a,#111111
            dist/github-snake-dark.svg?color_snake=#f2f2f2&color_dots=#161b22,#3a3a3a,#6e6e6e,#a8a8a8,#f2f2f2

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
